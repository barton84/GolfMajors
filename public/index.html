<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fantasy Golf Draft</title>
  <meta name="theme-color" content="#0b5d2e" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 5v20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M11 5l11 4.5L11 14z" fill="var(--accent)"/><ellipse cx="16" cy="26" rx="11" ry="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Fantasy Golf Draft</span>
      </a>
      <div class="topbar-right">
        <select id="draftPicker" aria-label="Choose tournament"></select>
        <button id="themeToggle" class="icon-btn" title="Switch theme" aria-label="Switch theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7a5 5 0 0 0 0 10z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="app" class="wrap"><div class="loading">Loading...</div></main>
  <div id="toast" class="toast" hidden></div>
  <dialog id="modal"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
